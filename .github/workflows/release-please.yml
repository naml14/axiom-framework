name: Release Please

on:
  push:
    branches: [main]
  # Allow manual runs from the GitHub UI (Actions → Release Please → Run workflow)
  workflow_dispatch:

# release-please needs write access to open PRs and create releases
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    # Opt into Node.js 24 to silence the Node.js 20 deprecation warning
    # from release-please-action until they release a native v24 build.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          # Uses release-please-config.json + .release-please-manifest.json
          # instead of release-type: node to have explicit control over the package name.
          # On each push to main, release-please:
          #   1. Parses conventional commits since last release
          #   2. Opens/updates a "Release PR" with bumped version + CHANGELOG entry
          #   3. When that PR is merged, creates the GitHub Release + tag automatically
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish to npm only when release-please actually creates a release.
  # Uses npm Trusted Publishing with OIDC (no long-lived token):
  # https://docs.npmjs.com/trusted-publishers
  # The Trusted Publisher must be configured on npmjs.com with:
  #   organization/user: naml14
  #   repository: axiom-framework
  #   workflow filename: release-please.yml
  #   allowed actions: npm publish
  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # `id-token: write` is the critical permission: it allows GitHub Actions to
    # mint the short-lived OIDC token that npm exchanges for a publish token.
    # `contents: read` is enough for checkout — release-please already pushed
    # the tag/release, so this job only needs to read the tree.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # npm >= 11.5.1 is the first npm that implements the Trusted Publishing
      # OIDC exchange, and the runner's default Node ships an older npm.
      # No `registry-url`: setup-node would write a `_authToken=${NODE_AUTH_TOKEN}`
      # line into .npmrc, and an unset token breaks the OIDC path.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # `prepublishOnly` runs typecheck → tests → build through bun, so the
      # published artifact is always verified.
      #
      # `npm publish`, never `bun publish`: Bun does not implement npm's OIDC
      # trusted-publishing exchange (oven-sh/bun#22423, still open), so it fails
      # with "missing authentication" and no useful message. npm exchanges the
      # token minted by `id-token: write` and attaches provenance automatically
      # for public packages — no --provenance flag, no long-lived token.
      - name: Publish to npm
        run: npm publish --access public