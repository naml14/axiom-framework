name: Manual Publish

# Fallback workflow for publishing to npm when the automated
# release-please publish job fails (e.g. auth misconfiguration).
# Trigger from: Actions → Manual Publish → Run workflow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example axiom-framework-v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Publishes to npm using Trusted Publishing with OIDC:
  # https://docs.npmjs.com/trusted-publishers
  # The Trusted Publisher must be configured on npmjs.com with:
  #   organization/user: naml14
  #   repository: axiom-framework
  #   workflow filename: publish.yml
  #   allowed actions: npm publish
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same protected environment as the automatic publisher.
    environment: npm
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    # `id-token: write` is the critical permission: it allows GitHub Actions to
    # mint the short-lived OIDC token that npm exchanges for a publish token.
    permissions:
      contents: read
      id-token: write
    steps:
      # Publish exactly the tag the maintainer named, never an arbitrary ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      # npm >= 11.5.1 is the first npm that implements the Trusted Publishing
      # OIDC exchange, and the runner's default Node ships an older npm.
      # No `registry-url`: setup-node would write a `_authToken=${NODE_AUTH_TOKEN}`
      # line into .npmrc, and an unset token breaks the OIDC path.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.4

      # The tag, package.json, the release-please manifest and the CHANGELOG must
      # all name the same version before anything is published.
      - name: Validate the release tag
        run: bun run scripts/validate-release-version.ts --tag "${{ inputs.tag }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `prepublishOnly` runs typecheck → tests → build through bun, so the
      # published artifact is always verified.
      #
      # `npm publish`, never `bun publish`: Bun does not implement npm's OIDC
      # trusted-publishing exchange (oven-sh/bun#22423, still open), so it fails
      # with "missing authentication" and no useful message. npm exchanges the
      # token minted by `id-token: write` and attaches provenance automatically
      # for public packages — no --provenance flag, no long-lived token.
      - name: Publish to npm
        run: npm publish --access public