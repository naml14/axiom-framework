name: Manual Publish

# Fallback workflow for publishing to npm when the automated
# release-please publish job fails (e.g. auth misconfiguration).
# Trigger from: Actions → Manual Publish → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Publishes to npm using Trusted Publishing with OIDC:
  # https://docs.npmjs.com/trusted-publishers
  # The Trusted Publisher must be configured on npmjs.com with:
  #   organization/user: naml14
  #   repository: axiom-framework
  #   workflow filename: publish.yml
  #   allowed actions: npm publish
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # `id-token: write` is the critical permission: it allows GitHub Actions to
    # mint the short-lived OIDC token that npm exchanges for a publish token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          # No `registries:` block: authentication to npmjs.org is handled by
          # the OIDC token exchange, not by a long-lived NPM_TOKEN secret.

      - name: Install dependencies
        run: bun install

      # prepublishOnly script runs: typecheck → tests → build
      # `bun publish` with OIDC generates provenance automatically because the
      # repo and package are public; no `--provenance` flag is required.
      - name: Publish to npm
        run: bun publish --access public