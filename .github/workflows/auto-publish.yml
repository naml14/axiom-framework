name: Auto-publish pending release

# Background: the npm account `naml14` was temporarily suspended (read-only
# mode for 72h) on 2026-09-16 because a recovery code was used to log in.
# The 0.9.11 release was fully prepared (tag created, manifest bumped, dist
# built, PRs merged) but the publish step failed with E403.
#
# This workflow polls every 6 hours until the suspension expires and the
# pending version becomes publishable. Once published it becomes a no-op
# (early-exit when the version is already on npm).
#
# After v0.9.11 is successfully published, delete this workflow — the
# regular `release-please.yml` + `publish.yml` chain will handle subsequent
# releases.

on:
  # Poll every 6 hours. Suspension expires 2026-09-19 22:20 UTC; this gives
  # us at least one successful run within ~30 min of the unlock.
  schedule:
    - cron: '0 */6 * * *'
  # Manual trigger — if you want to force a check instead of waiting for the
  # next scheduled run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-pending:
    name: Publish pending version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Read pending version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          registries: |
            https://registry.npmjs.org/|$NPM_TOKEN

      - name: Check if already published
        id: already
        run: |
          if npm view "axiom-framework@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} is already on npm — nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} is NOT on npm yet — will attempt publish."
          fi

      - name: Publish to npm
        if: steps.already.outputs.published != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # prepublishOnly runs typecheck + tests + build; reuse it for the
          # safety net, but skip prepublishOnly's own `bun publish` call by
          # invoking publish directly.
          bun run typecheck
          bun test
          bun run build
          bun publish --access public